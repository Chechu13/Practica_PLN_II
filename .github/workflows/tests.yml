name: Unit tests

on:
  push:
    branches:
      - master
      - main
      - "feature/**"
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Python 3.12 - CPU
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --extra test --extra quality
      - name: Run unit tests
        env:
          CUDA_VISIBLE_DEVICES: ""
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: uv run pytest -q
      - name: Run Flake8
        continue-on-error: true
        run: uv run flake8 src tests
      - name: Run Bandit
        continue-on-error: true
        run: uv run bandit -c pyproject.toml -r src
      - name: Run Vulture
        continue-on-error: true
        run: uv run vulture src --min-confidence 80
      - name: Run Mypy
        continue-on-error: true
        run: uv run mypy src
