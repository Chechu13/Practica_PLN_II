[project]
name = "practica-pln-ii"
version = "0.1.0"
description = "Análisis Exploratorio de Datos (EDA) para un corpus de textos y preguntas de PLN."
readme = "README.md"
requires-python = "==3.12.*"

dependencies = [
    "pandas",
    "matplotlib",
    "seaborn",
    "jupyter",
    "transformers",
    "tqdm",
    "bitsandbytes>=0.46.0",
    "accelerate",
    "peft",
    "torch",
    "torchvision",
    "scikit-learn",
    "ddgs",
    "datasets>=5.1.0",
    "trl>=1.17.0",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[tool.uv]
