[project]
name = "practica-pln-ii"
version = "0.1.0"
description = "Análisis Exploratorio de Datos (EDA) para un corpus de textos y preguntas de PLN."
readme = "README.md"
requires-python = "==3.12.*"

dependencies = [
    "pandas",
    "matplotlib",
    "seaborn",
    "jupyter",
    "transformers",
    "tqdm",
    "bitsandbytes>=0.46.0",
    "accelerate",
    "peft",
    "torch",
    "torchvision",
    "scikit-learn",
    "ddgs",
    "datasets>=5.1.0",
    "trl>=1.17.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
quality = [
    "bandit[toml]>=1.7",
    "flake8>=7.0",
    "mypy>=1.10",
    "vulture>=2.11",
]

[tool.bandit]
exclude_dirs = ["tests", "notebooks", "models"]
skips = ["B101"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
show_error_codes = true

[tool.vulture]
paths = ["src"]
exclude = ["*/notebooks/*", "*/models/*"]
min_confidence = 80

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[tool.uv]
